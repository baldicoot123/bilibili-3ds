name: Build Sagami Dictionary CIA

on:
  workflow_dispatch:
  push:
    branches:
      - codex/sagami-dictionary-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CIA packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bsdiff ca-certificates curl gh unzip

          curl -fL -o /tmp/bannertool.zip \
            https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -q /tmp/bannertool.zip -d /tmp/bannertool
          install -m 0755 /tmp/bannertool/linux-x86_64/bannertool /usr/local/bin/bannertool

          curl -fL -o /tmp/makerom.tar.gz \
            https://github.com/3DSGuy/Project_CTR/archive/refs/tags/makerom-v0.19.0.tar.gz
          tar -xzf /tmp/makerom.tar.gz -C /tmp
          make -C /tmp/Project_CTR-makerom-v0.19.0/makerom deps -j2
          make -C /tmp/Project_CTR-makerom-v0.19.0/makerom -j2
          install -m 0755 /tmp/Project_CTR-makerom-v0.19.0/makerom/bin/makerom \
            /usr/local/bin/makerom

      - name: Build 3DSX and CIA
        run: make -C SAGAMI-Dictionary -j2 cia

      - name: Create checksums
        run: |
          cd SAGAMI-Dictionary
          sha256sum sagami_dictionary.cia sagami_dictionary.3dsx sagami_dictionary.smdh \
            > SHA256SUMS.txt

      - name: Create patch from original v0.1.0 CIA
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git worktree add --detach /tmp/sagami-original 2d9f4d40ee30a3bb860cdaed140fc88ebbcd3272
          make -C /tmp/sagami-original/SAGAMI-Dictionary -j2 cia
          bsdiff \
            /tmp/sagami-original/SAGAMI-Dictionary/sagami_dictionary.cia \
            SAGAMI-Dictionary/sagami_dictionary.cia \
            SAGAMI-Dictionary/sagami_dictionary_priority_fix.bsdiff
          cd SAGAMI-Dictionary
          sha256sum sagami_dictionary_priority_fix.bsdiff >> SHA256SUMS.txt

      - name: Update release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload sagami-dictionary-v0.1.0 \
            SAGAMI-Dictionary/sagami_dictionary.cia \
            SAGAMI-Dictionary/sagami_dictionary.3dsx \
            SAGAMI-Dictionary/sagami_dictionary.smdh \
            SAGAMI-Dictionary/sagami_dictionary_priority_fix.bsdiff \
            SAGAMI-Dictionary/SHA256SUMS.txt \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sagami-dictionary-v0.1.0
          if-no-files-found: error
          path: |
            SAGAMI-Dictionary/sagami_dictionary.cia
            SAGAMI-Dictionary/sagami_dictionary.3dsx
            SAGAMI-Dictionary/sagami_dictionary.smdh
            SAGAMI-Dictionary/sagami_dictionary_priority_fix.bsdiff
            SAGAMI-Dictionary/SHA256SUMS.txt
